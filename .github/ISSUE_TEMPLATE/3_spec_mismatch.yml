name: 명세 불일치
description: 구현이 문서와 다르거나 문서끼리 어긋난다
labels: ["spec-mismatch"]
body:
  - type: markdown
    attributes:
      value: 계약을 바꿔야 하면 코드보다 문서가 먼저다 (SC-CM-001).
  - type: textarea
    id: gap
    attributes:
      label: 문서 / 코드
      description: 문서는 뭐라고 하고 코드는 어떻게 되어 있는지.
    validations: { required: true }
  - type: textarea
    id: decision
    attributes:
      label: 어떻게 할지
      description: 선택지가 여럿이면 나눠서. 안 정했으면 그렇게 적는다.
    validations: { required: true }
  - type: textarea
    id: impact
    attributes:
      label: 같이 봐야 할 것
      description: 고치면 따라 바뀌는 문서나 화면.
