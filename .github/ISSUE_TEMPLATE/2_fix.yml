name: 결함
description: 동작이 기대와 다르다
title: "[FIX] "
labels: ["fix"]
body:
  - type: markdown
    attributes:
      value: |
        제목은 증상이지 원인이 아니다. 원인은 아래 칸의 몫이고, 제목 쓸 때는 보통 모른다.
        에러 코드 · 상태 코드 · 실제 값을 제목에 넣으면 나중에 검색된다.
  - type: textarea
    id: actual
    attributes:
      label: 증상
      description: 재현 방법이 있으면 같이. 로그는 요약하지 말고 그대로.
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
      description: 근거가 되는 명세 항목이 있으면 함께.
    validations: { required: true }
  - type: textarea
    id: cause
    attributes:
      label: 원인
      description: 아직 모르면 비운다.
  - type: textarea
    id: impact
    attributes:
      label: 영향
      description: 무엇이 망가지고 무엇은 멀쩡한지.
