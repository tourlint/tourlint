name: 노션 개정 필요
description: 결정이 났고 정본에 반영해야 한다
labels: ["docs"]
body:
  - type: markdown
    attributes:
      value: |
        절차는 `docs/notion/README.md` 참고. 편집 → `status` → `check` → `plan` → push → `accept`.
        정본을 MCP로 직접 고치지 않습니다.
  - type: textarea
    id: decision
    attributes:
      label: 확정된 내용
    validations: { required: true }
  - type: textarea
    id: why
    attributes:
      label: 배경
      description: 어떤 공백이나 모순이 있었는지.
    validations: { required: true }
  - type: textarea
    id: targets
    attributes:
      label: 고칠 문서와 항목
      value: |
        - [ ] 
    validations: { required: true }
