name: 작업
description: 구현하거나 조사해야 하는 일
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        만든 뒤 오른쪽에서 마일스톤(목표 주차)과 담당자, `track:` 라벨을 지정해 주세요.
  - type: textarea
    id: what
    attributes:
      label: 할 일
      description: 끝났을 때 뭐가 달라져 있는지 한두 줄로.
    validations: { required: true }
  - type: textarea
    id: why
    attributes:
      label: 배경
      description: 지금 안 하면 뭐가 막히는지.
    validations: { required: true }
  - type: textarea
    id: done
    attributes:
      label: 체크
      description: 뭘 확인하면 끝난 건지. 측정 가능하게.
      value: |
        - [ ] 
    validations: { required: true }
  - type: input
    id: refs
    attributes:
      label: 참고
      description: 근거가 되는 요구사항 ID나 문서 링크. 없으면 비워도 됩니다.
      placeholder: "FR-AU-004, DR-TD-003"
