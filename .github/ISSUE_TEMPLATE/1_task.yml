name: 작업
description: 구현하거나 조사해야 하는 일
labels: ["task"]
body:
  - type: textarea
    id: what
    attributes:
      label: 무엇을
      description: 끝났을 때 무엇이 달라져 있는지로 쓴다.
    validations: { required: true }
  - type: textarea
    id: why
    attributes:
      label: 왜 필요한가
      description: 지금 안 하면 무엇이 막히는지. 근거 조항 ID 가 있으면 함께 적는다.
    validations: { required: true }
  - type: input
    id: refs
    attributes:
      label: 근거 조항
      placeholder: "FR-AU-004 · DR-TD-003 · NF-MT-001 (없으면 '해당 없음')"
    validations: { required: true }
  - type: dropdown
    id: track
    attributes:
      label: 트랙
      options:
        - A — 검수 엔진 (apps/api/src/engine)
        - B — 제품 표면 (apps/web · 인증 · 상품 CRUD)
        - 공동 (문서 · 제출물 · 인프라)
    validations: { required: true }
  - type: dropdown
    id: week
    attributes:
      label: 목표 주차
      options: ["W1 (~8/28)", "W2 (~9/4)", "W3 (~9/11)", "W4 (~9/14 기능 동결)", "W5 (~9/20 제출)", "미정"]
    validations: { required: true }
  - type: textarea
    id: done
    attributes:
      label: 완료 판정
      description: 무엇을 확인하면 끝난 것인가. 측정 가능하게 쓴다.
      placeholder: "예) TP-03 이 29점 · 차단 2 · 오류 1 · 주의 2 · 확인불가 1 을 낸다"
    validations: { required: true }
