name: 작업
description: 구현하거나 조사해야 하는 일
labels: ["task"]
body:
  - type: textarea
    id: what
    attributes:
      label: 할 일
    validations: { required: true }
  - type: textarea
    id: why
    attributes:
      label: 배경
      description: 지금 안 하면 뭐가 막히는지. 자명하면 비워도 된다.
  - type: input
    id: refs
    attributes:
      label: 참고
      placeholder: FR-AU-004, DR-TD-003
