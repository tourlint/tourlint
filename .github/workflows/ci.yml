# .github/workflows/ci.yml — main 보호 규칙과 짝 (build + lint + typecheck + unit)
name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm 버전은 package.json 의 packageManager 필드를 따른다.
      # version 을 따로 박으면 락파일 포맷과 어긋나 --frozen-lockfile 이 깨진다.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # apps/api 가 @tourlint/shared 의 dist 를 참조하므로 typecheck 앞에서 먼저 빌드한다.
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
