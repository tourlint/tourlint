# .github/workflows/deploy-watch.yml — main 이 실제로 배포됐는지 지켜보고, 떨어진 컨테이너는 다시 뽑는다
#
# 2026-08-29 에 main 머지 두 건이 두 시간 밀렸다. 그동안 /health 는 계속 ok 였고 아무도
# 몰랐다 — 옛 코드가 돌고 있어도 살아 있는 것은 사실이라 상태만으로는 구분이 안 된다.
# 결국 /docs-json 의 라우트 태그가 mock 인 것을 보고 알아냈는데 그건 요행이었다.
#
# 2026-09-21 · 22 에는 새 API 컨테이너가 공사 게이트웨이에 못 닿는 일이 배포 14번 중 3번
# 있었다. 흐름 로그로 보면 SYN 만 나가고 돌아오는 패킷이 없다 — 컨테이너가 놓인 경로의
# 문제라 같은 이미지를 다시 뽑는 것이 유일한 회복이다(#700 · #757). /health 검사가 그런
# 컨테이너를 서비스에 올리지는 않지만(FAILED · 옛 컨테이너 유지) 회복은 사람이 눌러야 했다.
# 여기서 **이 커밋의 api 배포가 FAILED 면 같은 이미지로 다시 뽑는다**(최대 3번). 빌드는
# 다시 하지 않는다.
#
# Railway 는 저장소 밖에서 배포한다. 여기서 할 수 있는 것은 결과를 확인하고 다시 뽑는 것뿐이고,
# 그래도 안 되면 빨간 X 로 남겨 다음 배포 사고를 두 시간 뒤가 아니라 몇 분 안에 알게 한다.
name: deploy-watch
on:
  push:
    branches: [main]
  # 배포가 늦게 흘러갈 수 있어 손으로 다시 볼 수 있게 둔다
  workflow_dispatch:
    inputs:
      timeoutSeconds:
        description: '대기 시간(초). 1 로 두면 곧장 실패시켜 진단 단계가 무엇을 찍는지 볼 수 있다'
        required: false
        default: '1800'
      redeploy:
        description: 'force 면 지금 api 배포를 같은 이미지로 한 번 다시 뽑는다 — 재배포 경로 시험용'
        required: false
        default: 'auto'

# 새 머지가 오면 앞의 감시는 의미가 없다 — 그 커밋은 이미 최신이 아니다
concurrency:
  group: deploy-watch
  cancel-in-progress: true

permissions:
  contents: read
  # 실패 원인을 좁히려고 Railway 가 만든 배포 기록을 읽는다
  deployments: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: /health 의 커밋이 이 커밋이 될 때까지 기다린다 — 떨어진 api 배포는 다시 뽑는다
        env:
          HEALTH_URL: https://api-production-1e7c2.up.railway.app/health
          # 실패한 배포 하나가 검사 시간 300초를 다 쓴다. 세 번 다시 뽑을 만큼 둔다
          TIMEOUT_SECONDS: ${{ inputs.timeoutSeconds || '1800' }}
          REDEPLOY_MODE: ${{ inputs.redeploy || 'auto' }}
          MAX_REDEPLOYS: '3'
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          want="$(git rev-parse --short=7 HEAD)"
          sha="$(git rev-parse HEAD)"
          echo "기다리는 커밋: $want"
          deadline=$(( $(date +%s) + TIMEOUT_SECONDS ))
          seen=""
          redeploys=0
          # 다시 뽑은 배포 id. 그 배포의 결과만 본다 — 실패한 원래 배포를 또 뽑지 않으려고
          watching=""

          gql() {
            curl -sS --max-time 25 https://backboard.railway.com/graphql/v2 \
              -H 'Content-Type: application/json' \
              -H "Project-Access-Token: $RAILWAY_TOKEN" -d "$1" || true
          }

          # api 서비스의 배포 중 이 커밋 것(가장 최근) → "id status". 토큰이 없으면 빈 줄
          api_deployment() {
            [ -z "${RAILWAY_TOKEN:-}" ] && return 0
            local who pid eid sid q res
            who="$(gql '{"query":"{projectToken{projectId environmentId}}"}')"
            pid="$(printf '%s' "$who" | jq -r '.data.projectToken.projectId // empty')"
            eid="$(printf '%s' "$who" | jq -r '.data.projectToken.environmentId // empty')"
            [ -z "$pid" ] && return 0
            sid="$(gql "$(jq -nc --arg p "$pid" '{query:"query($p:String!){project(id:$p){services{edges{node{id name}}}}}",variables:{p:$p}}')" \
              | jq -r '.data.project.services.edges[]?.node | select(.name=="api") | .id' | head -1)"
            [ -z "$sid" ] && return 0
            q="$(jq -nc --arg p "$pid" --arg e "$eid" --arg s "$sid" \
              '{query:"query($p:String!,$e:String!,$s:String!){deployments(first:8,input:{projectId:$p,environmentId:$e,serviceId:$s}){edges{node{id status createdAt meta}}}}",variables:{p:$p,e:$e,s:$s}}')"
            res="$(gql "$q")"
            if [ -n "$watching" ]; then
              printf '%s' "$res" | jq -r --arg id "$watching" '.data.deployments.edges[]?.node | select(.id==$id) | "\(.id) \(.status)"' | head -1
            else
              printf '%s' "$res" | jq -r --arg sha "$sha" '.data.deployments.edges[]?.node | select(.meta.commitHash==$sha) | "\(.id) \(.status)"' | head -1
            fi
          }

          # 같은 이미지로 다시 뽑는다. 빌드는 다시 하지 않는다 — 코드가 아니라 컨테이너의 경로가 문제다
          redeploy() {
            local m res
            m="$(jq -nc --arg id "$1" '{query:"mutation($id:String!){deploymentRedeploy(id:$id,usePreviousImageTag:true){id status}}",variables:{id:$id}}')"
            res="$(gql "$m")"
            printf '%s' "$res" | jq -r '.data.deploymentRedeploy.id // empty'
            printf '%s' "$res" | jq -r '.errors[]?.message' | sed 's/^/  railway: /' >&2
          }

          if [ "$REDEPLOY_MODE" = "force" ]; then
            cur="$(api_deployment)"
            [ -z "$cur" ] && { echo "::error::재배포 시험 — 이 커밋의 api 배포를 못 찾았다 (토큰 · 커밋 확인)"; exit 1; }
            echo "재배포 시험 · 지금 배포 ${cur%% *} (${cur##* }) 를 같은 이미지로 다시 뽑는다"
            watching="$(redeploy "${cur%% *}")"
            [ -z "$watching" ] && { echo "::error::재배포 요청이 거부됐다"; exit 1; }
            redeploys=1
            echo "새 배포 $watching"
          fi

          tick=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            body="$(curl -sS --max-time 20 "$HEALTH_URL" || true)"
            got="$(printf '%s' "$body" | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p')"

            if [ "$got" = "$want" ] && [ -z "$watching" ]; then
              echo "::notice::배포 확인 · $want"
              exit 0
            fi
            if [ "$got" != "$seen" ]; then
              echo "$(date -u +%H:%M:%S) 배포본=${got:-없음} · 기다리는 것=$want"
              seen="$got"
            fi

            # Railway 쪽은 1분에 한 번만 묻는다
            if [ $(( tick % 3 )) -eq 0 ]; then
              dep="$(api_deployment)"
              if [ -n "$dep" ]; then
                id="${dep%% *}"; status="${dep##* }"
                case "$status" in
                  SUCCESS)
                    if [ -n "$watching" ]; then
                      echo "::notice::다시 뽑은 배포 $watching 이 살아났다 (재배포 $redeploys번)"
                      exit 0
                    fi ;;
                  FAILED|CRASHED)
                    if [ "$redeploys" -ge "$MAX_REDEPLOYS" ]; then
                      echo "::error::api 배포 $id 가 $status 다. $MAX_REDEPLOYS번 다시 뽑아도 안 됐다 — 공사 게이트웨이 쪽이 막혔을 수 있다. 흐름 로그(railway logs --network)를 본다."
                      echo "DEPLOYED=${seen:-}" >> "$GITHUB_ENV"
                      exit 1
                    fi
                    echo "::warning::api 배포 $id 가 $status 다 — 같은 이미지로 다시 뽑는다 ($(( redeploys + 1 ))/$MAX_REDEPLOYS)"
                    new="$(redeploy "$id")"
                    if [ -n "$new" ]; then
                      watching="$new"; redeploys=$(( redeploys + 1 ))
                      echo "새 배포 $new"
                    else
                      echo "::warning::재배포 요청이 거부됐다. 다음 확인 때 다시 시도한다"
                    fi ;;
                esac
              fi
            fi
            tick=$(( tick + 1 ))
            sleep 20
          done

          # 여기까지 왔으면 배포가 안 됐거나 아주 늦은 것이다. 어느 쪽이든 사람이 봐야 한다
          echo "::error::$TIMEOUT_SECONDS 초 안에 $want 가 배포되지 않았다 (배포본=${seen:-확인 불가})."
          echo "DEPLOYED=${seen:-}" >> "$GITHUB_ENV"
          exit 1

      - name: 왜 안 됐는지 좁힌다
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Railway 가 이 커밋에 대해 배포 기록을 만들었는지 본다. 만들었다면 어디까지 갔는지도.
          # 여기서 갈리는 것이 대응이 갈리는 지점의 전부다 — 연동이냐, 빌드냐, 밀린 거냐.
          sha="$(git rev-parse HEAD)"
          echo "커밋 $sha"

          ids="$(gh api "repos/$GITHUB_REPOSITORY/deployments?sha=$sha&per_page=10" --jq '.[].id' || true)"

          if [ -z "$ids" ]; then
            echo "::error::Railway 가 이 커밋에 배포 기록을 만들지 않았다."
            echo "  → 신호 자체가 안 갔거나 아직 처리 전이다. GitHub 연동(Settings → Source)과 사용량 한도를 본다."
            echo "  → 대시보드에서 Redeploy 가 되면 연동 문제, 그것도 안 되면 계정 · 한도 문제다."
            echo "  → 2026-08-29 에는 기록이 두 시간 뒤에야 생겼다. 이 워크플로를 나중에 다시 돌리면(Re-run)"
            echo "     그때 상태를 볼 수 있다."
            exit 1
          fi

          for id in $ids; do
            state="$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=1" --jq '.[0].state // "없음"')"
            env_id="$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id" --jq '.payload.environmentId // ""')"
            [ -n "$env_id" ] && echo "RAILWAY_ENV_ID=$env_id" >> "$GITHUB_ENV"
            echo "  기록 $id → $state"
            case "$state" in
              failure|error)
                echo "::error::Railway 가 배포를 시도했고 실패했다 ($state)."
                echo "  → 빌드나 기동이 깨졌다. Railway → Deployments → 해당 배포의 로그를 본다." ;;
              inactive)
                echo "::warning::더 새 커밋에 밀려 무효 처리됐다 (inactive)."
                echo "  → 그 사이 다른 머지가 있었다면 정상이다. 최신 커밋의 감시 결과를 본다." ;;
              in_progress|queued|pending)
                echo "::warning::아직 배포 중이다 ($state)."
                echo "  → 이 워크플로의 대기 시간(TIMEOUT_SECONDS)이 짧았을 수 있다." ;;
              success)
                echo "::warning::기록은 success 인데 /health 의 커밋이 다르다."
                echo "  → 앱이 옛 이미지로 떴거나 RAILWAY_GIT_COMMIT_SHA 가 안 들어갔다." ;;
            esac
          done
          exit 1

      - name: Railway 에 직접 물어본다
        if: failure()
        continue-on-error: true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          # 앞 단계가 「Railway 로그를 봐라」까지 짚어 준다. 여기서는 **그 로그를 끌고 온다.**
          #
          # 이 단계는 실패를 덮지 않는다 (continue-on-error). 토큰이 없거나 Railway 가
          # 스키마를 바꿔도 앞 단계의 진단은 그대로 남는다.
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "RAILWAY_TOKEN 이 없다. Railway 쪽 원인은 대시보드에서 본다."
            exit 0
          fi

          gql() {
            curl -sS --max-time 25 https://backboard.railway.com/graphql/v2 \
              -H 'Content-Type: application/json' \
              -H "Project-Access-Token: $RAILWAY_TOKEN" -d "$1" || true
          }

          # 프로젝트 토큰은 자기가 어느 프로젝트인지 안다. 여기에 id 를 박아 두지 않는다
          who="$(gql '{"query":"{projectToken{projectId environmentId}}"}')"
          pid="$(printf '%s' "$who" | jq -r '.data.projectToken.projectId // empty')"
          eid="$(printf '%s' "$who" | jq -r '.data.projectToken.environmentId // empty')"
          if [ -z "$pid" ]; then
            echo "토큰이 프로젝트를 못 알려줬다: $(printf '%s' "$who" | head -c 300)"
            echo "  → 계정 토큰을 넣었거나 만료됐다. 프로젝트 토큰으로 다시 만든다."
            exit 0
          fi

          q='{"query":"query($p:String!,$e:String!){deployments(first:5,input:{projectId:$p,environmentId:$e}){edges{node{id status createdAt}}}}","variables":{"p":"'"$pid"'","e":"'"$eid"'"}}'
          res="$(gql "$q")"
          rows="$(printf '%s' "$res" | jq -r '.data.deployments.edges[]?.node | "\(.createdAt[5:16]) \(.status) \(.id)"')"

          if [ -z "$rows" ]; then
            echo "Railway 가 배포 목록을 안 줬다: $(printf '%s' "$res" | head -c 300)"
            exit 0
          fi

          echo "Railway 최근 배포"
          # REMOVED 는 실패가 아니다 — 더 새 배포로 대체된 정상 상태다 (GitHub 의 inactive 와 같다)
          printf '%s\n' "$rows" | sed -E \
            -e 's/ SUCCESS / 성공     /' \
            -e 's/ (FAILED|CRASHED) / 실패     /' \
            -e 's/ REMOVED / 밀려남   /' \
            -e 's/ (BUILDING|DEPLOYING|QUEUED|INITIALIZING|WAITING) / 진행중   /' \
            | sed 's/^/  /'

          # 진짜 실패만 로그를 끌고 온다. 대시보드를 안 열어도 되게
          failed="$(printf '%s' "$res" | jq -r '[.data.deployments.edges[]?.node | select(.status | test("FAILED|CRASHED"))][0].id // empty')"
          if [ -z "$failed" ]; then
            echo
            echo "  실패한 배포는 없다."
            echo "  → 전부 성공인데 /health 가 옛 커밋이면 앱이 옛 이미지로 떴거나 커밋 주입이 빠진 것이다."
            echo "  → 목록이 비었거나 오래된 것뿐이면 이 커밋에 배포가 아예 안 걸린 것이다."
            exit 0
          fi

          echo
          echo "실패한 배포 $failed 의 로그"
          lq='{"query":"query($d:String!){buildLogs(deploymentId:$d,limit:60){message}}","variables":{"d":"'"$failed"'"}}'
          printf '%s' "$(gql "$lq")" | jq -r '.data.buildLogs[]?.message // empty' | tail -40 | sed 's/^/  /'
