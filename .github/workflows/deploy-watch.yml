# .github/workflows/deploy-watch.yml — main 이 실제로 배포됐는지 지켜본다
#
# 2026-08-29 에 main 머지 두 건이 두 시간 밀렸다. 그동안 /health 는 계속 ok 였고 아무도
# 몰랐다 — 옛 코드가 돌고 있어도 살아 있는 것은 사실이라 상태만으로는 구분이 안 된다.
# 결국 /docs-json 의 라우트 태그가 mock 인 것을 보고 알아냈는데 그건 요행이었다.
#
# Railway 는 저장소 밖에서 배포한다. 여기서 할 수 있는 것은 **결과를 확인하는 것**뿐이고,
# 안 되면 빨간 X 로 남겨 다음 배포 사고를 두 시간 뒤가 아니라 몇 분 안에 알게 한다.
name: deploy-watch
on:
  push:
    branches: [main]
  # 배포가 늦게 흘러갈 수 있어 손으로 다시 볼 수 있게 둔다
  workflow_dispatch:
    inputs:
      timeoutSeconds:
        description: '대기 시간(초). 1 로 두면 곧장 실패시켜 진단 경로를 확인할 수 있다'
        required: false
        default: '900'

# 새 머지가 오면 앞의 감시는 의미가 없다 — 그 커밋은 이미 최신이 아니다
concurrency:
  group: deploy-watch
  cancel-in-progress: true

permissions:
  contents: read
  # 실패 원인을 좁히려고 Railway 가 만든 배포 기록을 읽는다
  deployments: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: /health 의 커밋이 이 커밋이 될 때까지 기다린다
        env:
          HEALTH_URL: https://api-production-1e7c2.up.railway.app/health
          # 빌드 + 기동에 보통 2분 안쪽이다. 열 배쯤 여유를 둔다
          TIMEOUT_SECONDS: ${{ inputs.timeoutSeconds || '900' }}
        run: |
          want="$(git rev-parse --short=7 HEAD)"
          echo "기다리는 커밋: $want"
          deadline=$(( $(date +%s) + TIMEOUT_SECONDS ))
          seen=""

          while [ "$(date +%s)" -lt "$deadline" ]; do
            body="$(curl -sS --max-time 20 "$HEALTH_URL" || true)"
            got="$(printf '%s' "$body" | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p')"

            if [ "$got" = "$want" ]; then
              echo "::notice::배포 확인 · $want"
              exit 0
            fi
            if [ "$got" != "$seen" ]; then
              echo "$(date -u +%H:%M:%S) 배포본=${got:-없음} · 기다리는 것=$want"
              seen="$got"
            fi
            sleep 20
          done

          # 여기까지 왔으면 배포가 안 됐거나 아주 늦은 것이다. 어느 쪽이든 사람이 봐야 한다
          echo "::error::$TIMEOUT_SECONDS 초 안에 $want 가 배포되지 않았다 (배포본=${seen:-확인 불가})."
          echo "DEPLOYED=${seen:-}" >> "$GITHUB_ENV"
          exit 1

      - name: 왜 안 됐는지 좁힌다
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Railway 가 이 커밋에 대해 배포 기록을 만들었는지 본다. 만들었다면 어디까지 갔는지도.
          # 여기서 갈리는 것이 대응이 갈리는 지점의 전부다 — 연동이냐, 빌드냐, 밀린 거냐.
          sha="$(git rev-parse HEAD)"
          echo "커밋 $sha"

          ids="$(gh api "repos/$GITHUB_REPOSITORY/deployments?sha=$sha&per_page=10" --jq '.[].id' || true)"

          if [ -z "$ids" ]; then
            echo "::error::Railway 가 이 커밋에 배포 기록을 만들지 않았다."
            echo "  → 신호 자체가 안 갔거나 아직 처리 전이다. GitHub 연동(Settings → Source)과 사용량 한도를 본다."
            echo "  → 대시보드에서 Redeploy 가 되면 연동 문제, 그것도 안 되면 계정 · 한도 문제다."
            echo "  → 2026-08-29 에는 기록이 두 시간 뒤에야 생겼다. 이 워크플로를 나중에 다시 돌리면(Re-run)"
            echo "     그때 상태를 볼 수 있다."
            exit 1
          fi

          for id in $ids; do
            state="$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=1" --jq '.[0].state // "없음"')"
            env_id="$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id" --jq '.payload.environmentId // ""')"
            [ -n "$env_id" ] && echo "RAILWAY_ENV_ID=$env_id" >> "$GITHUB_ENV"
            echo "  기록 $id → $state"
            case "$state" in
              failure|error)
                echo "::error::Railway 가 배포를 시도했고 실패했다 ($state)."
                echo "  → 빌드나 기동이 깨졌다. Railway → Deployments → 해당 배포의 로그를 본다." ;;
              inactive)
                echo "::warning::더 새 커밋에 밀려 무효 처리됐다 (inactive)."
                echo "  → 그 사이 다른 머지가 있었다면 정상이다. 최신 커밋의 감시 결과를 본다." ;;
              in_progress|queued|pending)
                echo "::warning::아직 배포 중이다 ($state)."
                echo "  → 이 워크플로의 대기 시간(TIMEOUT_SECONDS)이 짧았을 수 있다." ;;
              success)
                echo "::warning::기록은 success 인데 /health 의 커밋이 다르다."
                echo "  → 앱이 옛 이미지로 떴거나 RAILWAY_GIT_COMMIT_SHA 가 안 들어갔다." ;;
            esac
          done
          exit 1

      - name: Railway 에 직접 물어본다
        if: failure()
        continue-on-error: true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          # A 단계가 「Railway 로그를 봐라」까지 짚어 준다. 여기서는 그 로그를 끌고 온다.
          #
          # 이 단계는 **실패를 덮지 않는다** (continue-on-error). 토큰이 없거나 스키마가
          # 바뀌어도 앞 단계의 진단은 그대로 남는다.
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "RAILWAY_TOKEN 이 없다. Railway 쪽 원인은 대시보드에서 본다."
            exit 0
          fi

          api() {
            # 프로젝트 토큰과 계정 토큰의 헤더가 다르다. 둘 다 시도한다
            for header in "Project-Access-Token: $RAILWAY_TOKEN" "Authorization: Bearer $RAILWAY_TOKEN"; do
              out="$(curl -sS --max-time 25 https://backboard.railway.com/graphql/v2 \
                -H 'Content-Type: application/json' -H "$header" -d "$1" || true)"
              case "$out" in
                *'"data"'*) printf '%s' "$out"; return 0 ;;
              esac
            done
            printf '%s' "${out:-}"
            return 1
          }

          env_id="${RAILWAY_ENV_ID:-}"
          echo "환경 ${env_id:-확인 못 함}"

          q='{"query":"query($e:String!){deployments(first:5,input:{environmentId:$e}){edges{node{id status createdAt meta}}}}","variables":{"e":"'"$env_id"'"}}'
          res="$(api "$q")" || { echo "Railway 응답을 못 읽었다: ${res:0:400}"; exit 0; }
          echo "$res" | head -c 2000; echo
