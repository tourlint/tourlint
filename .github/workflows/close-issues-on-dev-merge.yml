# .github/workflows/close-issues-on-dev-merge.yml
#
# dev 로 머지된 PR 의 `Closes #N` 을 실제로 닫는다.
#
# GitHub 은 PR 이 **기본 브랜치(main)** 로 머지될 때만 키워드로 이슈를 닫는다. 이 저장소의
# 흐름은 작업 브랜치 → dev → main 이라 작업 PR 의 base 가 dev 이고, 그래서 `Closes #N` 이
# 아무 일도 하지 않는다 (2026-08-21 실측 — PR #18 이 Closes #5 를 달고 머지됐는데 #5 가
# 열린 채로 남았다). 기본 브랜치를 dev 로 바꾸면 되지만 Railway 배포가 main 에 물려 있다.
#
# base 가 dev 일 때만 돈다. main 머지는 GitHub 이 알아서 닫으므로 손대지 않는다.
#
# 닫는 것만 자동이다. **완료 판정 대조표는 사람이 쓴다** — 무엇을 어떻게 채웠는지는
# 기계가 알 수 없고, 그 표가 이슈를 닫는 근거이기 때문이다.
name: close-issues-on-dev-merge
on:
  pull_request:
    types: [closed]
    branches: [dev]

permissions:
  issues: write

jobs:
  close:
    # 닫히기만 하고 머지 안 된 PR 은 이슈를 닫을 이유가 없다
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Closes 키워드로 지목된 이슈를 닫는다
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body ?? '';

            // GitHub 이 인정하는 키워드와 같은 목록을 쓴다. 다른 저장소를 가리키는
            // `owner/repo#N` 형태는 일부러 받지 않는다 — 남의 이슈를 닫으면 안 된다.
            const re = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s+#(\d+)/gi;
            const numbers = [...new Set([...body.matchAll(re)].map((m) => Number(m[1])))];

            if (numbers.length === 0) {
              core.info('본문에 Closes 키워드가 없다. 할 일 없음.');
              return;
            }

            for (const issue_number of numbers) {
              const { owner, repo } = context.repo;
              let issue;
              try {
                ({ data: issue } = await github.rest.issues.get({ owner, repo, issue_number }));
              } catch (e) {
                // 없는 번호를 적었을 수 있다. 워크플로를 실패시키지 않는다 —
                // 머지는 이미 끝났고 여기서 빨간 X 를 내도 되돌릴 것이 없다.
                core.warning(`#${issue_number} 를 읽지 못했다: ${e.message}`);
                continue;
              }
              // PR 도 issues API 로 읽히므로 걸러낸다
              if (issue.pull_request !== undefined) {
                core.warning(`#${issue_number} 는 PR 이다. 건너뛴다.`);
                continue;
              }
              if (issue.state === 'closed') {
                core.info(`#${issue_number} 는 이미 닫혀 있다.`);
                continue;
              }
              await github.rest.issues.createComment({
                owner, repo, issue_number,
                body: `#${pr.number} 이 \`dev\` 로 머지되어 닫는다.\n\n`
                    + `\`Closes\` 키워드는 기본 브랜치 머지에서만 발동하므로 이 워크플로가 대신 닫는다. `
                    + `**완료 판정 대조표는 PR 이나 이 이슈의 코멘트를 본다** — 기계는 닫기만 한다.`,
              });
              await github.rest.issues.update({ owner, repo, issue_number, state: 'closed', state_reason: 'completed' });
              core.info(`#${issue_number} 닫음`);
            }
