packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@nestjs/core": true
  # vitest 가 데코레이터 메타데이터를 뽑게 하려면 네이티브 바이너리가 필요하다
  "@swc/core": true
  "unrs-resolver": true
  "@tailwindcss/oxide": true
  "sharp": true
  esbuild: true
  # @nestjs/swagger 가 끌고 오는 사용 추적 패키지. 설치 스크립트를 돌리지 않는다
  '@scarf/scarf': false
