# 시크릿 검사 설정 (NF-SC-008 · #869). CI 의 secrets 잡이 이 파일로 gitleaks 를 돌린다.
#
# 기본 규칙을 그대로 쓰고, 저장소 이력에서 나온 오탐만 **그 값으로** 뺀다. 규칙이나 파일을
# 통째로 끄지 않는다 — 같은 파일에 진짜 키가 들어와도 걸려야 한다.

[extend]
useDefault = true

[[allowlists]]
description = "인증키가 아닌 값 — 문서 예시와 설정 필드 이름 (2026-09-26 이력 전체 검사에서 나온 3건)"
targetRules = ["generic-api-key"]
regexes = [
  # apps/api/src/openapi/catalog/patches.ts — /docs 의 미리보기 예시 값
  '''pv_8b41d0e6a93c''',
  # apps/web/app/(app)/settings/page.tsx — 설정 폼의 필드 이름 (커밋 두 개에 같은 줄)
  '''r07MealMinutes''',
]
